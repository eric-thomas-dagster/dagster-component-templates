name: full test suite

# The per-push `tests` workflow only runs a small CURATED subset of this repo's ~500+ per-component
# `tests/` directories (see TEST_DIRS in tests.yml), to keep every push/PR fast. This workflow runs
# ALL of them -- real coverage of every component's own committed test suite, not just the curated
# set -- on a schedule instead, so it never slows down a push or blocks a merge. Triggers:
#   - nightly, 06:00 UTC
#   - workflow_dispatch (run on demand from the Actions tab)
# A failure here means some component's own test suite is broken -- check which job/component in the
# run summary, it does NOT mean a push should be blocked (this workflow never runs on push/PR).

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  full-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg (synthetic video generator tests)
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: ffmpeg
          version: 1.0
      - name: Verify ffmpeg is actually callable, repair if not
        # cache-apt-pkgs-action restores packages by extracting their cached files directly rather than
        # a real dpkg install, which skips ldconfig -- confirmed root cause (via a real failing run):
        # `ffmpeg: error while loading shared libraries: libblas.so.3: cannot open shared object file`,
        # even though `command -v ffmpeg` finds the binary fine. `sudo ldconfig` refreshes the shared
        # library cache so the already-restored .so files are actually found; apt-get is a further
        # fallback (its own docs' recommended escape hatch) on the rare chance ldconfig alone isn't
        # enough. (Earlier version of this step piped to `head -1`, which silently discarded ffmpeg's
        # real exit code -- a pipeline's status is its LAST command's, not the first's.)
        run: |
          sudo ldconfig
          if ! ffmpeg -version > /dev/null 2>&1; then
            echo "ffmpeg still broken after ldconfig -- falling back to a real apt-get install"
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # sqlglot and duckdb are PINNED to the versions the fake-warehouse tests (bq_fake.py / sql_fake.py) were written against:
          # they patch sqlglot's BigQuery/Snowflake/Databricks -> DuckDB translation, which differs between releases.
          pip install "dagster>=1.10.0" dagster-duckdb pandas pytest pyyaml chromadb "duckdb==1.5.6" "duckdb-engine==0.17.0" "sqlalchemy>=2" \
                      "sqlglot==28.0.0" jsonschema tabulate pyarrow litellm requests fsspec \
                      dlt cryptography scikit-learn geopandas \
                      google-auth google-api-python-client google-cloud-bigquery reportlab pillow
      - name: Install torch (CPU-only wheel -- reranker/sentiment_analyzer/zero_shot_classifier need it)
        # best effort: the default pip index bundles CUDA and can be 2GB+; the CPU-only index is far smaller
        # and is all a CI runner needs. transformers/sentence-transformers (installed below) pick this up
        # instead of pulling in the full CUDA build themselves.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu || echo "::warning::could not install torch; its contract tests will skip"
      - name: Install vendor client libraries (library-contract tests skip any that is missing)
        # best effort per package: a wheel that is unavailable for this Python must not fail the job, the matching contract tests just skip.
        # Wider list than tests.yml's -- this job also exercises components the curated fast suite never touches
        # (Snowflake/Databricks/Delta/Iceberg/Google Speech), so it needs their real client libraries too.
        run: |
          for pkg in dagster-gcp snowflake-connector-python databricks-sql-connector psycopg2-binary pymysql \
                     dagster-snowflake "deltalake>=0.15.0" "pyiceberg[sql-sqlite]>=0.6.0" databricks-sdk \
                     "google-cloud-speech>=2.20.0" dagster-iceberg pdfplumber "python-docx>=0.8.11" "openpyxl>=3.0.0" \
                     dagster-msteams slack_sdk beautifulsoup4 langchain-core transformers sentence-transformers; do
            pip install $pkg || echo "::warning::could not install $pkg; its contract tests will skip"
          done
      - name: Discover this shard's tests/ directories
        # Sharded across 6 groups (x2 Python versions = 12 jobs): running all ~500 directories in ONE
        # pytest process segfaulted partway through (confirmed locally, reproducibly, around the same
        # point each time -- a tqdm background-monitor-thread crash, almost certainly from however much
        # global/native-extension state (C-extension SDKs, thread pools, etc.) accumulates over a single
        # process running hundreds of unrelated test files back to back). Splitting into several smaller,
        # isolated processes sidesteps that entirely -- a crash in one shard doesn't lose the other 5 --
        # and runs faster too, via real parallelism instead of one long serial pass.
        run: |
          find . -type d \( -name ".venv" -o -name "node_modules" -o -name "__pycache__" -o -name "site-packages" -o -name "dist" \) -prune \
                 -o -type d -name "tests" -print | sort | awk -v shard=${{ matrix.shard }} -v total=6 'NR % total == shard' > shard_test_dirs.txt
          echo "Shard ${{ matrix.shard }}: $(wc -l < shard_test_dirs.txt) tests/ directories"
      - name: Run this shard's test suites
        # --import-mode=importlib: hundreds of these directories are all literally named "tests" with no
        # __init__.py. The default "prepend" import mode resolves modules by inserting each file's parent dir
        # into sys.path and importing by bare basename, which collides the first time two different "tests"
        # packages fight over the same sys.modules entry (observed: quickstarts/receipts_learning_loop/tests
        # failing with "No module named 'tests.test_demo'" once every tests/ dir in the repo is collected
        # together). importlib mode gives each file a unique fully-qualified module name instead, avoiding
        # the collision entirely -- this is the documented fix for exactly this class of pytest problem.
        # --continue-on-collection-errors: there will always be a long tail of rare optional deps not
        # worth chasing one at a time -- one component's missing/broken import should skip that file,
        # not abort collection of the rest of this shard's real tests.
        run: python -m pytest $(cat shard_test_dirs.txt) -q -p no:cacheprovider -W ignore --import-mode=importlib --continue-on-collection-errors
