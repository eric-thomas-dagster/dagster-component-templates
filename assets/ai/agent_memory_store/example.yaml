type: dagster_community_components.AgentMemoryStoreComponent
attributes:
  asset_name: customer_agent_memory
  upstream_asset_key: support_chat_turns

  user_id_column: customer_id
  role_column: role
  content_column: content

  # Optional: scope memories per conversation session rather than accumulating
  # across a customer's entire history.
  # run_id_column: session_id

  # Smoke-check that written memories are actually retrievable -- catches a
  # silently-broken vector-store/embedder config without asserting relevance.
  validate_search: true
  validate_search_query: "What does this customer care about?"

  group_name: agent_memory
  kinds: [mem0, memory, llm]
  owners:
    - support-ai@example.com

  # Demo mode writes to a local JSON file -- no Mem0/LLM/embedder calls, no API keys.
  demo_mode: true

  # Real mode (demo_mode: false) example -- Mem0's own self-hosted default
  # stack if vector_store/llm/embedder are all left unset is Qdrant (on-disk)
  # + OpenAI (requires OPENAI_API_KEY). NOTE: Mem0's own zero-config default
  # model (gpt-5-mini) currently crashes -- its default temperature=0.1
  # isn't accepted by that model's real API (confirmed live 2026-10-31,
  # see README "Known issue"). Set llm explicitly to a model that accepts
  # a custom temperature, e.g.:
  #
  # vector_store:
  #   provider: qdrant
  #   config: {host: localhost, port: 6333}
  # llm:
  #   provider: openai
  #   config: {model: gpt-4o-mini, temperature: 0.1}
  # embedder:
  #   provider: openai
  #   config: {model: text-embedding-3-small}
