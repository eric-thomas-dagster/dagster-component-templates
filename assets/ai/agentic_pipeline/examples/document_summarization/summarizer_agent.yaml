type: dagster_community_components.AgentCardComponent
attributes:
  agent_id: summarizer_agent
  name: "Document Summarizer Agent"
  description: "Produces an executive summary and extracts action items from a document."
  skills:
    - id: summarize_document
      name: "Summarize document"
      description: "Given a document's text, returns a short executive summary + a list of action items."
      tags: [documents]
  capabilities: [summarize]
  invocation:
    mcp_server:
      name: summarizer-mcp
      type: stdio
      command: [python3, "./summarizer_agent_server.py"]
    tool_name: summarize_document
    # {prompt} is the delegate step's `task:` text (an instruction, not the
    # document) -- {extra.src_text} is the real upstream data. Forgetting
    # extra.src_text here means the agent only ever sees the instruction
    # and the LLM fabricates plausible-sounding but ungrounded output.
    tool_args_template: {document_text: "{extra.src_text}"}
