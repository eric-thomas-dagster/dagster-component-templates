type: dagster_community_components.AgentCardComponent
attributes:
  agent_id: triage_agent
  name: "Ticket Triage Agent"
  description: "Assigns an owning team and urgency to severe support tickets."
  skills:
    - id: triage_ticket
      name: "Triage ticket"
      description: "Given ticket context, returns owning team + urgency."
      tags: [support]
  capabilities: [triage]
  invocation:
    mcp_server:
      name: triage-mcp
      type: stdio
      command: [python3, "./triage_mcp_server.py"]
    tool_name: triage_ticket
    # {prompt} is the delegate step's `task:` text (an instruction, not the
    # ticket data) -- {extra.src_text} is the real upstream data (the
    # filtered severe tickets). Forgetting extra.src_text here means the
    # agent only ever sees the instruction and the LLM fabricates
    # plausible-sounding but ungrounded output.
    tool_args_template: {ticket_context: "{extra.src_text}"}
