# execution_mode: sql on BigQuery, learning from retrieval receipts that live in BigQuery tables.
# One CREATE OR REPLACE TABLE statement chunks, stamps provenance, joins the receipt feedback, classifies and embeds; the corpus never leaves BigQuery.
type: dagster_component_templates.ContextEngineeringPipelineComponent
attributes:
  asset_name: support_kb_bq
  source:
    kind: warehouse_query
    resource_key: bigquery
    sql: "SELECT ticket_id, body, customer_id FROM `my-project.raw.support_tickets`"
  id_column: ticket_id
  text_column: body
  metadata_columns: [customer_id]
  execution_mode: sql
  sql_dialect: bigquery
  output_table: my-project.analytics.support_kb
  steps:
    - id: chunks
      op: chunk
      chunk_size: 500
      chunk_overlap: 50
      chunk_id_prefix: "support_kb_bq:"
    - id: classified
      op: classify
      candidate_labels: [billing, technical, shipping, other]
    - id: embedded
      op: embed
      model: my-project.analytics.text_embedding_model   # a BigQuery ML remote model over a Vertex AI embedding endpoint
  receipts:
    dataset: my-project.context_receipts   # holds context_receipts, context_receipt_items, context_receipt_events, context_item_scores
    table_prefix: ""
    window_days: 30
    min_retrievals: 5
    min_outcomes: 3
    quarantine: {mean_outcome_below: -0.3, mode: flag}
    rewrite_below: -0.3                                     # chunks at or below this mean outcome are listed in receipts_feedback.rewrite_candidates
    prune: {never_retrieved_after_receipts: 200, mode: flag}   # dead weight: flagged (feedback_dead_weight); mode: exclude drops the rows
    regression_check: {min_outcomes: 10, max_drop: 0.15, severity: WARN}
