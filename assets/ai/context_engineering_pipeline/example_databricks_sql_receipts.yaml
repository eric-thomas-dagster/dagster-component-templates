# execution_mode: sql on Databricks, learning from retrieval receipts that live in Unity Catalog (Delta) tables.
# One CREATE OR REPLACE TABLE statement chunks, stamps provenance, joins the receipt feedback, classifies and embeds; the corpus never leaves Databricks.
# Create the receipt tables with receipt_table_ddl(dataset, prefix, "databricks") (the block inlined in component.py) or load them with your receipt writer.
type: dagster_component_templates.ContextEngineeringPipelineComponent
attributes:
  asset_name: support_kb_dbx
  source:
    kind: warehouse_query
    resource_key: databricks
    sql: "SELECT ticket_id, body, customer_id FROM raw.support.tickets"
  id_column: ticket_id
  text_column: body
  metadata_columns: [customer_id]
  execution_mode: sql
  sql_dialect: databricks
  output_table: analytics.kb.support_kb
  steps:
    - id: chunks
      op: chunk
      chunk_size: 500
      chunk_overlap: 50
      chunk_id_prefix: "support_kb_dbx:"
    - id: classified
      op: classify
      candidate_labels: [billing, technical, shipping, other]
    - id: embedded
      op: embed
      model: databricks-gte-large-en
  receipts:
    dataset: analytics.context_receipts   # catalog.schema holding context_receipts, context_receipt_items, context_receipt_events, context_item_scores
    table_prefix: ""
    window_days: 30
    min_retrievals: 5
    min_outcomes: 3
    quarantine: {mean_outcome_below: -0.3, mode: flag}
    regression_check: {min_outcomes: 10, max_drop: 0.15, severity: WARN}
