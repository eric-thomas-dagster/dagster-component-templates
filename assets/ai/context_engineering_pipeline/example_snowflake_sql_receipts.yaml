# execution_mode: sql on Snowflake (Cortex), learning from retrieval receipts that live in Snowflake tables.
# One CREATE OR REPLACE TABLE statement chunks, stamps provenance, joins the receipt feedback, classifies and embeds; the corpus never leaves Snowflake.
# Create the receipt tables with receipt_table_ddl(dataset, prefix, "snowflake") (the block inlined in component.py) or load them with your receipt writer.
type: dagster_community_components.ContextEngineeringPipelineComponent
attributes:
  asset_name: support_kb_sf
  source:
    kind: warehouse_query
    resource_key: snowflake
    sql: "SELECT ticket_id, body, customer_id FROM RAW.SUPPORT.TICKETS"
  id_column: ticket_id
  text_column: body
  metadata_columns: [customer_id]
  execution_mode: sql
  sql_dialect: snowflake_cortex
  output_table: ANALYTICS.KB.SUPPORT_KB
  steps:
    - id: chunks
      op: chunk
      chunk_size: 500
      chunk_overlap: 50
      chunk_id_prefix: "support_kb_sf:"
    - id: classified
      op: classify
      candidate_labels: [billing, technical, shipping, other]
    - id: embedded
      op: embed
      model: snowflake-arctic-embed-m
  receipts:
    dataset: ANALYTICS.CONTEXT_RECEIPTS   # DATABASE.SCHEMA holding context_receipts, context_receipt_items, context_receipt_events, context_item_scores
    table_prefix: ""
    window_days: 30
    min_retrievals: 5
    min_outcomes: 3
    quarantine: {mean_outcome_below: -0.3, mode: flag}
    regression_check: {min_outcomes: 10, max_drop: 0.15, severity: WARN}
