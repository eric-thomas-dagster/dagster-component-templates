type: dagster_community_components.RAGPipelineComponent
attributes:
  asset_name: docs_qa
  upstream_asset_key: user_questions
  query_column: query
  answer_column: answer
  sources_column: sources
  group_name: rag

  personas:
    fast_gen:
      provider: openai
      model: gpt-4o-mini
      api_key_env_var: OPENAI_API_KEY
      temperature: 0.0
      max_tokens: 1024

  retrievers:
    docs_vs:
      kind: chromadb
      collection_name: product_docs
      path: ./chroma_db
      embedding:
        provider: voyage
        model: voyage-3-large
        input_type: query
        api_key_env_var: VOYAGE_API_KEY

  rerankers:
    voyage_rr:
      provider: voyage
      model: rerank-2.5
      api_key_env_var: VOYAGE_API_KEY

  steps:
    - id: retrieved
      op: retrieve
      retriever: docs_vs
      top_k: 20

    - id: reranked
      op: rerank
      source: retrieved
      reranker: voyage_rr
      top_k: 5

    - id: answered
      op: generate
      source: reranked
      persona: fast_gen
      system_prompt: >
        You are a helpful product docs assistant. Answer using ONLY the
        provided context. If the answer isn't in the context, say so.
