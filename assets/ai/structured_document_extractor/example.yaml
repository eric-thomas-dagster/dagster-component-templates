type: dagster_component_templates.StructuredDocumentExtractorComponent
attributes:
  asset_name: invoice_fields
  upstream_asset_key: incoming_invoices   # e.g. a file_lister asset -- mutually exclusive with `path` below
  document_type: invoice                  # picks the invoice preset's output_fields
  input_column: local_path                # pairs directly with file_lister's output
  input_type: file
  model: gpt-4o
  api_key_env_var: OPENAI_API_KEY

  # — no separate file_lister asset needed: list documents directly —
  # path: s3://my-bucket/invoices/**/*.pdf   # or gs://, abfss://, or a local path
  # (leave upstream_asset_key unset when using path)
  # post_process: move                      # or 'delete' -- default 'none' reprocesses every run
  # post_process_dir: s3://my-bucket/invoices/_processed/  # required for 'move'

  # — try a different document type: just change document_type, same component —
  # document_type: resume
  # document_type: medical_record

  # — anything not covered by a preset: document_type: custom + your own fields —
  # document_type: custom
  # output_fields: [permit_number, issuing_authority, expiration_date, conditions]

  # — start from a preset but tweak it: output_fields always overrides the preset —
  # document_type: invoice
  # output_fields: [invoice_number, vendor, total_amount, po_reference]

  # — mark where a field appears (images only) -- fractional 0-1 coords,
  #   cropped and sent as a labeled close-up hint alongside the full image.
  #   Dagster Designer's DocumentExtractorConfigStep has a draw-a-box UI
  #   that produces this directly; hand-writing it is the fallback. —
  # field_regions:
  #   invoice_number: {x: 0.6, y: 0.05, width: 0.3, height: 0.08}
