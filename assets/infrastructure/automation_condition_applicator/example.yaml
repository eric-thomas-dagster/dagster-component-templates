type: dagster_community_components.AutomationConditionApplicatorComponent
attributes:
  preserve_existing: true   # asset-level automation_condition wins over rules

  rules:
    # Narrow first → broad last (fall-through: first match wins)

    # Explicit cron — fires every hour, ignores 'daily' deps
    - name: critical_hourly
      selection: "tag:cadence=hourly"
      cron: "0 * * * *"
      ignore_selection: "tag:cadence=daily"

    # Group-based with allow/ignore (the "3 daily + 1 monthly" pattern)
    - name: daily_with_monthly_boundary
      selection: "group:revenue_marts"
      cron: "0 9 * * *"
      ignore_selection: "tag:cadence=monthly"

    # Auto-derive from upstream cron schedules — pick most frequent
    - name: derive_for_silver
      selection: "group:silver"
      derive_from_upstreams: true
      strategy: most_frequent     # or 'least_frequent'

    # Wait for a job Dagster doesn't own (e.g. an external HL7 feed) to
    # report in since this morning's cron tick, then run once. Also gates
    # on upstream data-quality checks, not just upstream freshness.
    - name: wait_for_external_job
      selection: "key:lab_results_staging"
      all_deps_updated_since_cron: "30 18 * * 1-5"
      require_blocking_checks_passed: true

    # Preset for everything else — eager() plus a safe one-time backfill of
    # the latest missing partition (for turning automation on against a
    # graph that already has its upstream data), gated on blocking checks.
    - name: catchall_eager
      selection: "*"
      preset: eager_fill_missing
      require_blocking_checks_passed: true
