type: dagster_community_components.K8sJobAssetComponent
attributes:
  asset_name: nightly_training_job
  image: my-registry.example.com/model-trainer:v3
  command: ["python", "train.py"]
  namespace: ml-jobs
  env_vars:
    MODEL_NAME: churn_predictor
  cpu_limit: "2000m"
  memory_limit: "4Gi"
  image_pull_secrets:
    - my-registry-secret
  service_account_name: ml-jobs-runner
  timeout_seconds: 3600
  group_name: k8s
  deps: []
