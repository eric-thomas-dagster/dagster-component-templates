type: dagster_community_components.ModalPipesAssetComponent
attributes:
  asset_name: model_training

  app_file: ml/training_app.py
  function_name: train
  function_args:
    learning_rate: 0.001
    epochs: 10

  # Optional — only needed if the Dagster worker's env doesn't have
  # `modal setup` credentials or you want per-env token override.
  modal_token_id_env_var: MODAL_TOKEN_ID
  modal_token_secret_env_var: MODAL_TOKEN_SECRET

  # Optional Modal environment (e.g. 'production' vs 'staging').
  modal_env: production

  group_name: ml
  kinds: [modal, pipes, ml, training]
  owners:
    - ml-platform@example.com

  # Example Modal function (referenced above):
