type: dagster_community_components.WarmScheduledJobComponent
attributes:
  asset_name: pricing_refresh_warm
  group_name: pricing

  schedule: "*/15 * * * *"    # every 15 minutes, evaluated by this component's
                               # own loop -- NOT a Dagster ScheduleDefinition
  timezone: UTC

  warmup_fn: "myproject.jobs.pricing:warmup"     # runs ONCE per bounded run:
                                                  # load the pricing model,
                                                  # open the warehouse connection
  tick_fn: "myproject.jobs.pricing:run_tick"     # runs once per precise tick,
                                                  # as a direct in-process call

  max_seconds: 3600           # bounded run (< your Serverless run-duration cap);
                               # re-pays warmup once per hour, not once per tick
  tick_error_handling: continue  # one bad tick doesn't force a full restart

  # Pair with (unmodified) StreamingRunHealthSensorComponent for auto-restart:
  #
  # type: dagster_community_components.StreamingRunHealthSensorComponent
  # attributes:
  #   sensor_name: pricing_refresh_health
  #   job_name: __ASSET_JOB
  #   asset_selection: [pricing_refresh_warm]
  #   minimum_interval_seconds: 30
  #   default_status: running

# Multi-job mode (separate component instance -- uncomment to use instead of
# the single-job example above): several small, unrelated automations
# sharing ONE warm process and ONE warmup pass (e.g. "watch QuickBooks for
# paid invoices, update HubSpot, draft a reply with OpenAI" style
# integration glue) -- each still gets its own AssetKey/materialization
# history, so they stay independently visible in the catalog even though
# they share one instance.
#
# type: dagster_community_components.WarmScheduledJobComponent
# attributes:
#   warmup_fn: "myproject.automations.shared:warmup"  # ONE shared warmup --
#     # e.g. returns {"hubspot": client, "quickbooks": client, "openai": client}
#   max_seconds: 3600
#   # expose_informational_schedules defaults to true: each job below gets a
#   # real, default-STOPPED ScheduleDefinition in the Schedules tab showing
#   # its real cadence -- it targets a harmless no-op marker asset, never the
#   # real automation, so it's safe even if someone flips it to RUNNING.
