  # webdav_base_url: "https://dav.example.com/remote.php/dav/files/user/"
  # webdav_username: "myuser"
  # webdav_password_env_var: WEBDAV_PASSWORD
  # source_path: "/Documents/"     # relative to webdav_base_url

  # --- OAuth-protected vendor APIs instead ---
