type: dagster_community_components.DltYamlSourceComponent
attributes:
  asset_name: my_rest_api_tables
  source_type: rest_api

  # dlt rest_api_source `client` config (same shape as dlt_rest_api_source).
  client:
    base_url: "https://api.example.com"
    auth:
      type: bearer
      token: "{{ env.MY_API_TOKEN }}"

  # Only rest_api_resources is active when source_type=rest_api (sql_resources/
  # filesystem_resources below are each only active for their own source_type).
  rest_api_resources:
    - name: customers
      primary_key: id
      endpoint:
        path: customers
      # write_disposition is inferred as 'merge' here because primary_key is set --
      # dlt's own default ('append') would duplicate rows on every re-materialization.
      # write_disposition: append   # explicit override: keep appending despite the key
      # x_min_rows: 10              # 'x_' prefix: custom metadata for a subclass's own
      # x_contract_columns: [id]    # checks; never reaches the underlying dlt call
      # --- Only take effect in asset_shape: multi_asset mode ---
      # description: "Customer records"
      # owners: ["team:crm"]
      # tags: { pii: "true" }
      # asset_key: ["crm", "customers"]   # instead of the default my_rest_api_tables_customers
    - name: orders
      primary_key: order_id
      endpoint:
        path: orders

  # --- Give each resource its own independently-materializable asset instead ---
  # asset_shape: multi_asset   # produces my_rest_api_tables_customers, my_rest_api_tables_orders
  #                             materializing one resource does not fetch or persist the others

  # --- Rename specific destination tables (default: destination table name = resource name) ---
  # table_name_map:
  #   customers: raw_customers          # orders keeps its declared name

  # --- Example: source_type=sql_database instead (uncomment and remove the rest_api fields above) ---
  # source_type: sql_database
  # connection_string: "{{ env.WAREHOUSE_CONNECTION_STRING }}"
  # schema_name: public
  # sql_resources:
  #   - name: customers
  #     primary_key: id
  #   - name: orders
  #     primary_key: order_id
  #     columns: [order_id, customer_id, amount, created_at]

  # --- Example: source_type=filesystem instead (uncomment and remove the rest_api fields above) ---
  # source_type: filesystem
  # filesystem_bucket_url: "s3://my-bucket/landing"
  # filesystem_resources:
  #   - name: orders
  #     file_glob: "orders/*.csv"
  #     primary_key: order_id
  #   - name: events
  #     file_glob: "events/*.parquet"
  #     file_format: parquet
  # filesystem_bucket_url credentials resolve from S3/GCS/Azure's standard env vars by
  # default. For SFTP/Azure (or multiple accounts of the same provider), set
  # filesystem_credentials instead -- see the README's "SFTP and Azure source
  # credentials" section for the full field list.
  # filesystem_bucket_url: "sftp://host.example.com/incoming"
  # filesystem_credentials:
  #   sftp_username: "{{ env.SFTP_USERNAME }}"
  #   sftp_password: "{{ env.SFTP_PASSWORD }}"

  # --- Schema change control: reject new columns and data-type changes once a table is
  # established (a resource's own first materialization can always create its initial
  # schema, in every mode) -- see the README's "Schema change control" section ---
  # on_schema_change: block_all   # or allow_new_columns; default is allow_all (today's behavior)
  # rest_api_resources:
  #   - name: customers
  #     endpoint:
  #       path: customers
  #     on_schema_change: allow_all   # per-resource override: this one stays permissive

  # --- Column pseudonymization: salted SHA-256, same pattern dlt's own docs recommend
  # for PII -- see the README's "Column pseudonymization" section ---
  # hash_columns: [email]
  # hash_salt: "{{ env.PII_HASH_SALT }}"   # required once hash_columns is set anywhere

  # --- Incremental loading: only load rows past the last synced cursor value, instead
  # of the full resource every run -- see the README's "Incremental loading" section ---
  # rest_api_resources:
  #   - name: orders
  #     endpoint:
  #       path: orders
  #     incremental:
  #       cursor_path: updated_at
  #       initial_value: "2024-01-01T00:00:00Z"
  #       start_param: updated_since

  # --- Row sampling cap: a real cap on real rows loaded, for cheaply checking a
  # connection/shape on a first run -- see the README's "Row sampling cap" section ---
  # max_rows_per_resource: 100

  # --- Column exclusion: drop columns before they reach the destination -- see the
  # README's "Column exclusion" section ---
  # exclude_columns: [internal_notes]

  # Organization
  description: "Customer and order tables from a generic REST API"
  group_name: "dlt_load_collection"
  include_preview_metadata: true
