# Example 1: simple single-resource GET, API-key auth (query-param style).
# Shape mirrors chargify_ingestion's real `customers`/`subscriptions`
# resources in this repo, generalized to the raw config shape.
type: dagster_component_templates.DltRestApiSourceComponent
attributes:
  asset_name: my_vendor_ingestion
  client:
    base_url: "https://mysite.chargify.com"
    auth:
      type: http_basic
      username: "{{ env.MY_VENDOR_API_KEY }}"
      password: "x"
  resources:
    - name: customers
      endpoint:
        path: customers.json
        data_selector: "$"
    - name: subscriptions
      endpoint:
        path: subscriptions.json
        data_selector: "$"
  group_name: my_vendor_ingestion

