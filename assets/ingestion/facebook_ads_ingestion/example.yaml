type: dagster_community_components.FacebookAdsIngestionComponent
attributes:
  asset_name: facebook_ads_data

  # Facebook Ads Account Configuration
  account_id: "act_123456789"
  access_token: "${FACEBOOK_ACCESS_TOKEN}"

  # Optional: For long-lived tokens
  # app_id: "${FACEBOOK_APP_ID}"
  # app_secret: "${FACEBOOK_APP_SECRET}"

  # Resources to extract
  resources: "campaigns,ads,insights"

  # --- Give each resource its own independently-materializable asset instead ---
  # asset_shape: multi_asset   # produces facebook_ads_data_campaigns, _ads, _insights, etc.
  #                             materializing one resource does not fetch or persist the others
  #                             (selecting only standard resources never runs the insights source, or vice versa)

  # --- Rename specific destination tables (default: destination table name = resource name) ---
  # table_name_map:
  #   insights: raw_insights          # other resources keep their default name

  # Historical data to load (days)
  initial_load_past_days: 30

  # Filter ads by state
  ad_states: "ACTIVE,PAUSED"

  # Insights configuration
  # insights_fields: "impressions,clicks,spend,reach,cpm,ctr,conversions"
  # insights_breakdown: "age"
  time_increment_days: 1

  # Organization
  description: "Facebook Ads campaign and performance data"
  group_name: "facebook_ads"
  include_preview_metadata: true
