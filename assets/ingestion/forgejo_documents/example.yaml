type: dagster_community_components.ForgejoDocumentsComponent
attributes:
  asset_name: platform_docs
  api_base_url: https://git.mycompany.com/api/v1   # self-hosted instance; defaults to https://codeberg.org/api/v1
  access_token_env_var: FORGEJO_TOKEN
  owner: platform-team
  repo: service
  group_name: forgejo_documents

  # --- What gets fetched (default: all three) ---
  # resources: files,issues,pulls

  # --- 'files': repo tree walk + content fetch, filtered by extension/path ---
  file_extensions: ".md,.mdx,.rst"
  path_prefix: docs/                   # omit to walk the whole tree
  # ref: main                          # omit to use the repo's default branch

  # --- 'issues'/'pulls' filters ---
  # issue_state: open                   # open | closed | all
  # issues_since: "2024-01-01T00:00:00Z" # 'issues' only -- Forgejo's 'pulls' endpoint has no since/before filter

  # --- Give each resource its own independently-materializable asset instead of
  #     unioning them into one DataFrame tagged by a `_resource` column ---
  # asset_shape: multi_asset           # produces platform_docs_files, platform_docs_issues, platform_docs_pulls
  #                                     # materializing one does not fetch or persist the others

  # --- Rename specific destination tables ---
  # table_name_map:
  #   files: raw_docs

  # --- Persist directly to a warehouse instead of returning a DataFrame ---
  # destination: snowflake            # or bigquery, postgres, databricks, filesystem, ...
  # dataset_name: forgejo_docs
  # persist_only: true                 # see ../DESTINATIONS.md
