type: dagster_community_components.GitHubIngestionComponent
attributes:
  asset_name: github_repo_data

  # Authentication
  access_token: "{{ env('GITHUB_ACCESS_TOKEN') }}"

  # Repository configuration
  owner: "my-org"
  repositories:
    - "repo-1"
    - "repo-2"

  # Resources to extract
  resources:
    - issues
    - pull_requests

  # --- Give each resource its own independently-materializable asset instead ---
  # asset_shape: multi_asset   # produces github_repo_data_issues, github_repo_data_pull_requests
  #                             materializing one resource does not fetch or persist the others

  # --- Rename specific destination tables (default: destination table name = resource name) ---
  # table_name_map:
  #   issues: raw_issues          # pull_requests keeps its GitHub name

  # Organization
  description: "GitHub repository issues and pull requests"
  group_name: "github"
  include_preview_metadata: true
