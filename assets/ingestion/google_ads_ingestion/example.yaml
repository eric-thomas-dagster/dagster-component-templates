type: dagster_community_components.GoogleAdsIngestionComponent
attributes:
  asset_name: google_ads_data

  # Google Ads Customer Configuration
  customer_id: "123-456-7890"

  # OAuth Authentication
  developer_token: "${GOOGLE_ADS_DEV_TOKEN}"
  client_id: "${GOOGLE_ADS_CLIENT_ID}"
  client_secret: "${GOOGLE_ADS_CLIENT_SECRET}"
  refresh_token: "${GOOGLE_ADS_REFRESH_TOKEN}"
  project_id: "${GOOGLE_CLOUD_PROJECT_ID}"

  # Service Account Authentication (alternative to OAuth)
  # use_service_account: true
  # service_account_email: "service@project.iam.gserviceaccount.com"
  # private_key: "${GOOGLE_ADS_PRIVATE_KEY}"
  # impersonated_email: "admin@example.com"

  # Resources to extract
  resources: "customers,campaigns"

  # --- Give each resource its own independently-materializable asset instead ---
  # asset_shape: multi_asset   # produces google_ads_data_customers, google_ads_data_campaigns, etc.
  #                             materializing one resource does not fetch or persist the others

  # --- Rename specific destination tables (default: destination table name = resource name) ---
  # table_name_map:
  #   campaigns: raw_campaigns          # other resources keep their default name

  # Date range for performance metrics (optional)
  # start_date: "2024-01-01"
  # end_date: "2024-12-31"

  # Organization
  description: "Google Ads campaign and performance data"
  group_name: "google_ads"
  include_preview_metadata: true
