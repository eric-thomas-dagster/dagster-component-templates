type: dagster_community_components.ODataIngestionComponent
attributes:
  asset_name: business_partners

  # Service URL + entity set
  service_url: https://my300000.s4hana.cloud.sap/sap/opu/odata/sap/API_BUSINESS_PARTNER
  entity_set: A_BusinessPartner
  odata_version: v2

  # Auth — basic (SAP default)
  auth_type: basic
  auth_username_env_var: S4HANA_USER
  auth_password_env_var: S4HANA_PASSWORD

  # Query options
  select: BusinessPartner,BusinessPartnerName,Country
  filter: CreationDate ge datetime'{partition_key}T00:00:00'

  # Partitioning
  partition_type: daily
  partition_start: '2024-01-01'

  # Optional: route this asset to a project-registered IO manager (e.g. a
  # warehouse-table IO manager) instead of returning a DataFrame through the
  # default IO manager.
  # io_manager_key: warehouse_io_manager

  group_name: sap
  kinds: [odata, sap]

  # One component instance, N entity-set assets -- set `extracts:` instead of
  # the single-instance asset_name/entity_set above (mutually exclusive).
  # Each entry can override any field, including filter/select/partition_type.
  # extracts:
  #   - asset_name: business_partners
  #     entity_set: A_BusinessPartner
  #     select: BusinessPartner,BusinessPartnerName,Country
  #   - asset_name: sales_orders
  #     entity_set: A_SalesOrder
  #     select: SalesOrder,SalesOrganization,SoldToParty
