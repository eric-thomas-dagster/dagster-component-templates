type: dagster_community_components.ShopifyIngestionComponent
attributes:
  asset_name: shopify_data

  # Shopify Store Configuration
  shop_url: "mystore.myshopify.com"
  private_app_password: "${SHOPIFY_PRIVATE_APP_PASSWORD}"

  # Resources to extract
  resources: ["customers", "orders", "products"]

  # --- Give each resource its own independently-materializable asset instead ---
  # asset_shape: multi_asset   # produces shopify_data_customers, _orders, _products
  #                             materializing one resource does not fetch or persist the others

  # --- Rename specific destination tables (default: destination table name = resource name) ---
  # table_name_map:
  #   orders: raw_orders          # other resources keep their Shopify name

  # Optional: Start date for incremental loading
  # start_date: "2024-01-01"

  # Optional: Filter orders by status
  order_status: "any"

  # Organization
  description: "Shopify e-commerce data ingestion"
  group_name: "shopify"
  include_preview_metadata: true
