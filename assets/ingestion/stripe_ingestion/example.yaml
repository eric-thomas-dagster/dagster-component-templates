type: dagster_community_components.StripeIngestionComponent
attributes:
  asset_name: stripe_data

  # Stripe Configuration
  api_key: "${STRIPE_API_KEY}"

  # Resources to extract
  resources: "customers,subscriptions,charges,invoices"

  # --- Give each resource its own independently-materializable asset instead ---
  # asset_shape: multi_asset   # produces stripe_data_customers, _subscriptions, etc.
  #                             materializing one resource does not fetch or persist the others

  # --- Rename specific destination tables (default: destination table name = resource name) ---
  # table_name_map:
  #   customers: raw_customers      # other resources keep their Stripe name

  # Date Range (optional)
  # start_date: "2024-01-01"
  # end_date: "2024-12-31"

  # Loading mode
  incremental: false

  # Organization
  description: "Stripe payment and subscription data"
  group_name: "stripe"
  include_preview_metadata: true
