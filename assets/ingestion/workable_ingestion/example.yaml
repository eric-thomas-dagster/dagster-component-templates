type: dagster_community_components.WorkableIngestionComponent
attributes:
  asset_name: workable_recruitment_data

  # Authentication
  api_token: "{{ env('WORKABLE_API_TOKEN') }}"
  subdomain: "your-company"

  # Resources to extract
  resources:
    - jobs
    - candidates

  # Organization
  description: "Workable recruitment pipeline data"
  group_name: "workable"
  include_preview_metadata: true
