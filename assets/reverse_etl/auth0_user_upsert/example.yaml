# Auth0UserUpsertComponent -- DataFrame -> Auth0 user sync.
#
# SAFE BY DEFAULT: operation: sync (the default, shown here) only ever
# creates a user that doesn't exist yet or updates profile attributes on
# one that does. It can never block or delete anyone -- see README.md's
# "Safety" section before pointing this at a production tenant.

type: dagster_component_templates.Auth0UserUpsertComponent
attributes:
  asset_name: auth0_employee_sync
  upstream_asset_key: dbt_marts_active_employees
  resource_key: auth0_resource

  connection: "Username-Password-Authentication"   # used only when creating a new user
  fields_map:
    work_email: email                 # required -- the match key
    full_name: name
    department: user_metadata.department
    title: user_metadata.title

  operation: sync                     # default -- create-if-absent / update-if-present
  batch_size: 5000                    # safety cap

  group_name: reverse_etl
  description: "Sync active-employee mart into Auth0 (profile attributes only)."
  # owners: [identity-team@corp.com]
