# USERS mode — bulk-upsert Iterable users
type: dagster_community_components.DataframeToIterableComponent
attributes:
  asset_name: iterable_daily_user_sync
  upstream_asset_key: dim_customers_current

  resource_key: iterable
  mode: users
  email_column: email
  user_id_column: customer_id
  prefer_user_id: true

  fields_map:
    first: firstName
    last: lastName
    ltv: lifetime_value_usd            # nests under dataFields
    segment: segment

  freshness_cron: "0 8 * * *"

