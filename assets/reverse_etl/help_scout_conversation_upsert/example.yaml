# HelpScoutConversationUpsertComponent — DataFrame → Help Scout conversation create-or-update.
# Requires a HelpScoutResourceComponent registered under the same resource_key.
#
# Supply EXACTLY ONE of:
#   1. `upstream_asset_key:` — chain from an existing Dagster asset that produces a DataFrame.
#   2. `source:` block       — read the DataFrame inline at run time (SQL / CSV / inline rows).

type: dagster_component_templates.HelpScoutConversationUpsertComponent
attributes:
  asset_name: help_scout_conversations_mirror

  # ── Option 1: upstream Dagster asset ─────────────────────────────
  upstream_asset_key: warehouse_support_events

  # ── Option 2: inline source (uncomment ONE of the three shapes) ──
  # source:
  #   kind: sql
  #   resource_key: analytics_postgres   # any resource w/ .get_engine() or .get_connection()
  #   query: |
  #     SELECT conversation_id, email, subject, body, tags, status
  #     FROM analytics.support_events
  #
  # source:
  #   kind: sql
  #   database_url_env_var: ANALYTICS_POSTGRES_URL   # self-contained: build engine from env var
  #   query: "SELECT * FROM support_events"
  #
  # source:
  #   kind: csv
  #   path: /data/exports/support_events.csv
  #   read_csv_kwargs: {sep: ";", encoding: latin1}
  #
  # source:
  #   kind: inline
  #   rows:
  #     - {email: jane@example.com, subject: "Billing question", body: "Customer asks about invoice #123", tags: "billing,vip"}
  #     - {conversation_id: 98765, tags: "escalated,billing", status: "pending"}

  resource_key: help_scout_resource

  mailbox_id: 85                         # target mailbox for new conversations
  conversation_id_column: conversation_id  # present -> update; absent -> create
  customer_email_column: email           # create identifier (auto-upserts Customer)
  subject_column: subject                # required for create
  body_column: body                      # required for create
  tags_column: tags                      # create: included; update: FULL REPLACE
  # note_column: internal_note           # update-only
  status_column: status                  # update-only
  max_rows: 10000                        # safety cap per run

  group_name: reverse_etl
  description: "Mirror upstream support events into Help Scout conversations."
  # kinds: [helpscout, reverse_etl]
  # owners: [support@corp.com]
  # tags: {tier: production}
