# QuickBooksCustomerUpsertComponent -- DataFrame -> QuickBooks Online
# Customer reverse ETL. QBO has no single-call upsert: this component
# queries for an existing match (to get Id + SyncToken), then POSTs
# either a create (no Id/SyncToken) or a sparse update (Id + SyncToken set).
#
# Requires a QuickBooksResourceComponent registered under the same resource_key.

type: dagster_component_templates.QuickBooksCustomerUpsertComponent
attributes:
  asset_name: quickbooks_customers_mirror
  upstream_asset_key: dbt_marts_customers
  resource_key: quickbooks

  lookup_field: DisplayName                   # QBO enforces DisplayName uniqueness
  fields_map:
    customer_name: DisplayName                # upstream col -> QBO Customer field
    company_name: CompanyName
    email: PrimaryEmailAddr.Address            # dotted key -> nested QBO object
    phone: PrimaryPhone.FreeFormNumber

  batch_size: 5000                            # safety cap (1 query + 1 write per row)

  group_name: reverse_etl
  description: "Mirror dbt Customers mart into QuickBooks Online Customer records."
  # kinds: [quickbooks, reverse_etl]
  # owners: [finance-ops@corp.com]
