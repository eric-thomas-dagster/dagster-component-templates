# SyntheticPromptGeneratorComponent — Mode D (COMPOSED, no LLM).
#
# Emits a str-valued asset. Static partitions = topics list. Each partition
# materializes to one prompt string composed deterministically from the
# levers below. seed=42 → reproducible bit-for-bit.
#
# See the component's README for the other four modes:
#   A. LITERAL   — `prompts: {key: text}`
#   B. TEMPLATE  — `topics: [...]` + `template: "..."`
#   C. FIXED     — `prompt: "..."`  (unpartitioned)
#   E. LLM (v2)  — `topics: [...]` + `paraphrase_model: "..."`  (LiteLLM)
#
# Modes are mutually exclusive; validation catches misconfig at build_defs.

type: dagster_community_components.SyntheticPromptGeneratorComponent
attributes:
  asset_name: research_prompts
  group_name: prompts
  topics:
    - attention
    - transformer_vs_rnn
    - retrieval_augmented_generation
  # v1.5 levers — all optional, all pure Python (no LLM cost):
  persona: engineer          # student | engineer | executive | novice | expert
  style: technical           # formal | casual | technical | journalistic
  length: medium             # short | medium | long
  format_hint: paragraphs    # bullets | paragraphs | table | code
  depth: intermediate        # intro | intermediate | advanced
  seed: 42                   # reproducibility
  # count_per_topic: 3       # emit 3 variants per topic → partition keys become {topic}__v0 / __v1 / __v2
