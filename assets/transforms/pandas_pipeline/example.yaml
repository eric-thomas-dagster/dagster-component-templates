# The pandas-engine sibling to PolarsPipelineComponent — same YAML shape,
# same op menu, same partitioning. Pick this one when your team already
# standardizes on pandas; pick polars_pipeline for the lazy-query-plan-
# fusion performance story on large data / long op chains.

# ── Shape (a): flat shape — one source, one ops chain, one sink.

type: dagster_community_components.PandasPipelineComponent
attributes:
  asset_name: top_customers_by_region
  upstream_asset_key: raw_orders
  operations:
    - op: filter
      predicate: "status = 'paid'"
    - op: with_columns
      # `expressions:` is SQL, evaluated via an in-memory DuckDB connection
      # (DuckDB reads a pandas DataFrame natively, zero-copy). If you need
      # the full Python/pandas API instead, use `python_expressions:` — it
      # runs with `pd` and `df` (the frame so far) bound.
      expressions:
        total_amount: "amount * quantity + shipping"     # unambiguously SQL
      python_expressions:
        ingest_ts: "pd.Timestamp.utcnow()"               # ← pandas Python API
    - op: group_by
      group_by: [region, customer_id]
      aggregations:
        total:       {col: net_amount, agg: sum}
        order_count: {col: order_id,   agg: count}
    - op: sort
      by: [region, total]
      descending: true
    - op: head_per_group
      group_by: [region]
      n: 5
  group_name: analytics

