type: dagster_community_components.PerRowHttpFetcherComponent
attributes:
  asset_name: enriched_product_pages
  upstream_asset_key: product_urls
  url_column: url
  method: GET
  headers:
    User-Agent: dagster-data-pipeline/1.0
    Accept: application/json
  timeout_seconds: 30
  max_workers: 20
  retries: 2
  retry_on_status_codes: [429, 500, 502, 503, 504]
  output_prefix: response
  parse_json: true
  response_json_path: data.id
  group_name: web_enrichment

# POST variant with a per-row request body and bearer auth:
