# metrics.example.yaml — feed to sync_custom_metrics.py sync <this>
metrics:
  - name: rows_ingested
    description: Sum of rows_ingested metadata across all ingestion assets.
    metadata_key: rows_ingested
    aggregation: SUM
    unit: rows
    asset_selection: "group:ingestion"

  - name: pipeline_cost_usd
    description: Total pipeline compute cost across all assets.
    metadata_key: cost_usd
    aggregation: SUM
    unit: usd
    asset_selection: "*"

  - name: avg_api_latency_ms
    description: Average API-fetch latency across ingestion assets.
    metadata_key: fetch_latency_ms
    aggregation: AVG
    unit: milliseconds
    asset_selection: "group:ingestion"

  - name: max_freshness_lag_minutes
    description: Worst freshness lag observed across mart-layer assets.
    metadata_key: freshness_lag_minutes
    aggregation: MAX
    unit: minutes
    asset_selection: "tag:layer=mart"
