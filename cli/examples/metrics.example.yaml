# metrics.example.yaml — feed to sync_custom_metrics.py sync <this>
#
# `metadata_key` is the natural key (must be unique in your deployment).
# `unit_type` is one of: INTEGER | TIME_MS | TIME_SECONDS | FLOAT | BYTES
# Dagster+ Insights aggregates automatically — you don't set an aggregation
# or asset-selection here (that's a UI-side choice).
metrics:
  - metadata_key: cli_test_rows_ingested
    display_name: Rows Ingested (CLI test)
    description: Sum of rows_ingested metadata per materialization.
    unit_type: INTEGER

  - metadata_key: cli_test_cost_usd
    display_name: Compute Cost USD (CLI test)
    description: Compute cost in USD.
    unit_type: FLOAT

  - metadata_key: cli_test_fetch_latency_ms
    display_name: API Fetch Latency (CLI test)
    description: Per-materialization API fetch latency.
    unit_type: TIME_MS
