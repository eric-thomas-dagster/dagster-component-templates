# Minimal: `workspace:` block + import pipelines. Recommended starting point.
type: dagster_community_components.AzureDataFactoryComponent
attributes:
  workspace:
    subscription_id: "{{ env.AZURE_SUBSCRIPTION_ID }}"
    resource_group_name: my-resource-group
    factory_name: my-data-factory
    tenant_id_env_var: AZURE_TENANT_ID
    client_id_env_var: AZURE_CLIENT_ID
    client_secret_env_var: AZURE_CLIENT_SECRET
  import_pipelines: true
  group_name: adf_prod

---
# Advanced: pipelines + triggers + all 4 untested kinds with filtering.
# The 4 additional kinds (linked_services / datasets / data_flows /
# integration_runtimes) emit external assets only — read-only surface, no
# runtime action. Validate against your factory before relying on them.
type: dagster_community_components.AzureDataFactoryComponent
attributes:
  workspace:
    subscription_id: "{{ env.AZURE_SUBSCRIPTION_ID }}"
    resource_group_name: my-resource-group
    factory_name: my-data-factory
    tenant_id_env_var: AZURE_TENANT_ID
    client_id_env_var: AZURE_CLIENT_ID
    client_secret_env_var: AZURE_CLIENT_SECRET

  # Tested import toggles
  import_pipelines: true
  import_triggers: true

  # Untested — external assets only
  import_linked_services: true
  import_datasets: true
  import_data_flows: true
  import_integration_runtimes: true

  # Filtering (optional)
  filter_by_name_pattern: "^prod_.*"
  exclude_name_pattern: "test|dev"
  filter_by_tags: "env,team"

  # Observation sensor — polls ADF pipeline-run status
  polling_sensor: true
  poll_interval_seconds: 60

  group_name: adf_workspace
  description: Complete Azure Data Factory integration

  # StateBackedComponent cache location (optional — defaults to local filesystem)
  # defs_state:
  #   path: .dagster/adf_state

---
# Managed Identity / Azure CLI (no explicit SP credentials — omit *_env_var fields)
type: dagster_community_components.AzureDataFactoryComponent
attributes:
  workspace:
    subscription_id: "{{ env.AZURE_SUBSCRIPTION_ID }}"
    resource_group_name: my-resource-group
    factory_name: my-data-factory
  import_pipelines: true
  import_triggers: true
  group_name: adf_managed_identity

---
# Per-asset customization via `translation:` callable — customize key /
# tags / kinds / group per imported ADF object.
type: dagster_community_components.AzureDataFactoryComponent
attributes:
  workspace:
    subscription_id: "{{ env.AZURE_SUBSCRIPTION_ID }}"
    resource_group_name: my-resource-group
    factory_name: my-data-factory
  import_pipelines: true
  translation: "{{ load_python_module_attr('my_project.adf_translation.route_by_env_tag') }}"
  group_name: adf_prod

---
# Legacy per-pipeline overrides — still supported alongside `translation:`
# for backward compatibility. Prefer `translation:` for new configs.
type: dagster_community_components.AzureDataFactoryComponent
attributes:
  workspace:
    subscription_id: "{{ env.AZURE_SUBSCRIPTION_ID }}"
    resource_group_name: my-resource-group
    factory_name: my-data-factory
  import_pipelines: true
  group_name: adf_prod
  assets_by_pipeline_name:
    CopyCustomerData:
      key: raw/customers
      description: "Customer data copied by ADF"
      group_name: raw
      metadata:
        owner: platform-team
    DailyAggregationPipeline:
      - key: marts/daily_revenue
        description: "Daily revenue aggregation"
      - key: marts/daily_users
        description: "Daily active users"
