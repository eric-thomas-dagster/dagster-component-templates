type: dagster_community_components.CoalesceWorkspaceComponent
attributes:
  environment_id: "prod-environment-abc123"
  api_token_env_var: COALESCE_API_TOKEN
  asset_name_prefix: coalesce
  group_name: coalesce_transforms
  poll_interval_seconds: 10
  timeout_seconds: 3600

  # Node-level + column-level Coalesce test results surface as a
  # `coalesce_node_tests` AssetCheckResult per node (default on). Coalesce's
  # own test-halt setting (configured per test, in Coalesce) already decides
  # whether a failing test stops the run -- fail_run_on_test_failure only
  # matters if you want Dagster to additionally hard-fail the run whenever
  # ANY test failed, regardless of that per-test Coalesce setting.
  emit_test_checks: true
  fail_run_on_test_failure: false

  # Optional: enrich each asset's description/owners/tags/column lineage
  # from Coalesce's separately-licensed Catalog (Castor) product. Off by
  # default; fails soft (logs a warning, skips enrichment) if Catalog isn't
  # provisioned or the call errors.
  include_catalog_metadata: false
  catalog_api_token_env_var: COALESCE_CATALOG_API_TOKEN

  # Optional: override AssetSpec for specific Coalesce nodes
  assets_by_node_name:
    # Rename a node's asset key and add metadata
    orders_transform:
      key: finance/orders_clean
      description: "Cleaned and validated orders from Coalesce ETL"
      group_name: finance
      metadata:
        owner: finance-team
        sla_hours: "6"
      tags:
        dagster/storage_kind: snowflake
    # One node that produces multiple Dagster assets
    customer_rollup:
      - key: finance/customer_mrr
        description: "Monthly recurring revenue by customer"
      - key: finance/customer_arr
        description: "Annual recurring revenue by customer"
