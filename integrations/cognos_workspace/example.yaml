type: dagster_community_components.CognosWorkspaceComponent
attributes:
  workspace:
    base_url:   "{{ env.COGNOS_URL }}"
    username:   "{{ env.COGNOS_USER }}"
    password:   "{{ env.COGNOS_PASSWORD }}"
    namespace:  "{{ env.COGNOS_NAMESPACE }}"    # Cognos security namespace
    verify_ssl: false                            # self-signed lab servers

  # Walk these folders. Cognos uses searchPath-style paths.
  # folder_ids: ["/content/folder[@name='Finance']", "/content/folder[@name='Ops']"]

  report_selector:
    by_pattern: ["Monthly*", "Daily*"]
    exclude_by_pattern: ["*_deprecated"]

  group_name: cognos_reports
  asset_key_prefix: [cognos, report]
  output_format: CSV
  wait_for_completion: true
  timeout_seconds: 600

  defs_state:
    management_type: LOCAL_FILESYSTEM
    refresh_if_dev: true
