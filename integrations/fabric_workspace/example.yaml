type: dagster_community_components.FabricWorkspaceComponent
attributes:
  workspace:
    workspace_id:  "12345678-1234-1234-1234-123456789012"
    # Service principal auth — omit all three in Azure compute (falls
    # back to DefaultAzureCredential: env vars, Azure CLI, managed identity).
    tenant_id:     "{{ env.AZURE_TENANT_ID }}"
    client_id:     "{{ env.AZURE_CLIENT_ID }}"
    client_secret: "{{ env.AZURE_CLIENT_SECRET }}"
    max_wait_seconds: 3600
    poll_interval_seconds: 15

  # Pick which item types to import as Dagster assets
  import_lakehouses: true         # → external assets
  import_warehouses: true         # → external assets
  import_pipelines: true          # → trigger assets (materialize to run)
  import_notebooks: false
  import_dataflows: false

  group_name: fabric
