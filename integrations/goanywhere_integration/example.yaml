type: dagster_community_components.GoAnywhereIntegrationComponent

attributes:
  # demo_mode uses a demo client that logs a simulated GACMD lifecycle --
  # flip to false to hit a real GoAnywhere MFT server (requires
  # GOANYWHERE_USER / GOANYWHERE_PASSWORD env vars; GoAnywhere's admin
  # console/API need a trial or paid license key to do anything, even in the
  # official Docker images).
  demo_mode: true
  endpoint: "https://goanywhere.internal/goanywhere/rest"

  group_name: goanywhere_integration

  # Auth (production mode only)
  goanywhere_user_env: GOANYWHERE_USER
  goanywhere_password_env: GOANYWHERE_PASSWORD

  # Dagster-side retry policy applied to every project asset
  max_retries: 2
  retry_delay_seconds: 60

  # Everything below is opt-in scaffold, off by default -- turn on only what
  # you actually want in the UI.
  generate_external_monitor_sensor: true   # on by default: observes GoAnywhere-initiated runs
  generate_inbound_trigger_sensor: false   # stub sensor, logs only -- leave off unless wiring a real source
  generate_rerun_job: false                # Dagster+'s re-execution-from-failure usually covers this
  generate_dashboard_job: false
  generate_reconciliation: false

  # GoAnywhere Projects — each becomes a daily-partitioned Dagster asset.
  # `deps` is per-project now, not a single list shared by every project.
  projects:
    - project_name: PARTNER_EDI_INBOUND
      asset_name: goanywhere_partner_edi_inbound
      description: >-
        Nightly partner EDI pickup + decrypt + validate. Dagster runs the
        project via GACMD REST with the scheduled date passed as a project
        variable, then polls through Queued -> Active -> Successful.
      job_queue: SFTP_INBOUND
      mode: NORMAL
      priority: 5
      variables:
        SOURCE_PATH: "/inbound/partners"
      deps: []

    - project_name: REGULATORY_UPLOAD
      asset_name: goanywhere_regulatory_upload
      description: >-
        Encrypted regulatory file upload to the external SFTP endpoint.
        Must run after the partner EDI pickup completes.
      job_queue: SFTP_OUTBOUND
      mode: NORMAL
      priority: 8
      deps: ["goanywhere_partner_edi_inbound"]

  # Optional: files/folders landed by GoAnywhere that Dagster observes
  source_files: []
  # source_files:
  #   - path: "/inbound/partners/processed"
  #     asset_name: goanywhere_partner_edi_landed
  #     produced_by: goanywhere_partner_edi_inbound

  # Optional: override/add tags or metadata per project (tags/metadata are
  # MERGED onto the defaults; group_name/kinds/deps/description/owners are
  # replaced wholesale if you set them here).
  # translation:
  #   tags:
  #     team: data-eng
