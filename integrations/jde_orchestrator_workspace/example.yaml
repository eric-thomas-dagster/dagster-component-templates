type: dagster_community_components.JDEOrchestratorWorkspaceComponent
attributes:
  workspace:
    base_url:        "{{ env.JDE_AIS_URL }}"
    username:        "{{ env.JDE_USER }}"
    password:        "{{ env.JDE_PASSWORD }}"
    # api_path_prefix: "/jderest/v3/orchestrator"   # override if non-standard
    # verify_ssl:      false                        # self-signed dev only

  orchestration_selector:
    by_pattern: ["JDE_*"]
    exclude_by_pattern: ["*_deprecated"]

  group_name: jde_orchestrations
  asset_key_prefix: [jde, orchestration]
  async_mode: true
  wait_for_completion: true
  timeout_seconds: 1800

  defs_state:
    management_type: LOCAL_FILESYSTEM
    refresh_if_dev: true
