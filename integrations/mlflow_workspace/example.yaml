type: dagster_community_components.MLflowWorkspaceComponent
attributes:
  # Canonical workspace: block — same shape as
  # dagster_databricks.DatabricksWorkspaceComponent /
  # dagster_powerbi.PowerBIWorkspaceComponent /
  # dagster_fivetran.FivetranAccountComponent.
  # Secrets travel inline via {{ env.XXX }} Jinja templating.
  workspace:
    tracking_uri: "{{ env.MLFLOW_TRACKING_URI }}"    # e.g. https://mlflow.acme.com
    # username: "{{ env.MLFLOW_USER }}"              # optional basic auth
    # password: "{{ env.MLFLOW_PASSWORD }}"
    verify_ssl: true

  experiment_selector:
    by_pattern: ["prod_*", "staging_*"]

  model_selector:
    by_pattern: ["*_classifier", "*_regressor"]

  runs_limit: 100
  group_name: mlflow_workspace
  asset_key_prefix: [mlflow]

  defs_state:
    management_type: LOCAL_FILESYSTEM
    refresh_if_dev: true
