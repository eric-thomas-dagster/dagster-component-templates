type: dagster_community_components.QlikComposeWorkspaceComponent
attributes:
  workspace:
    base_url:  "{{ env.QLIK_COMPOSE_URL }}"
    api_token: "{{ env.QLIK_COMPOSE_TOKEN }}"
    # username: "{{ env.QLIK_COMPOSE_USER }}"       # legacy basic-auth
    # password: "{{ env.QLIK_COMPOSE_PASSWORD }}"
    # verify_ssl: false                              # self-signed dev only

  # Filter — per-kind selectors (Fivetran shape)
  projects: [FinanceDW, SalesDW]
  workflow_selector:
    by_pattern: ["FullBuild*", "Incremental*"]
  data_mart_selector:
    exclude_by_pattern: ["*_deprecated"]

  group_name: qlik_compose
  asset_key_prefix: [qlik_compose]
  wait_for_completion: true

  defs_state:
    management_type: LOCAL_FILESYSTEM
    refresh_if_dev: true
