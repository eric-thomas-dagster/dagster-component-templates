# SnowflakeWorkspaceComponent — canonical `workspace:` block shape.
# Mirrors dagster-databricks / dagster-fivetran / dagster-powerbi
# (all use a nested `workspace:` block that IS the resource).
#
# The workspace: block IS a dagster_snowflake.SnowflakeResource — password,
# SSO (externalbrowser), keypair (SNOWFLAKE_JWT + private_key_path), OAuth,
# and SQLAlchemy engines are all supported via the official resource.
#
# For SSO, keypair, and legacy-flat-field auth shapes — see the README.

type: dagster_community_components.SnowflakeWorkspaceComponent
attributes:
  workspace:
    account: "{{ env.SNOWFLAKE_ACCOUNT }}"
    user: "{{ env.SNOWFLAKE_USER }}"
    password: "{{ env.SNOWFLAKE_PASSWORD }}"
    warehouse: COMPUTE_WH
    database: ANALYTICS
    schema: PUBLIC
    role: SYSADMIN
  # Entity toggles — what to import as Dagster assets
  import_tasks: true
  import_stored_procedures: false
  import_dynamic_tables: false
  import_materialized_views: false
  import_streams: false
  import_alerts: false
  group_name: snowflake_prod
  description: Production Snowflake tasks
