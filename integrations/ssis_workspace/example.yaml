# SsisWorkspaceComponent — SSIS packages as Dagster assets.
# Backing SQL: SSISDB.catalog.packages / executions / operation_messages.

type: dagster_community_components.SsisWorkspaceComponent
attributes:
  # Set true to smoke-test this whole component (discovery, execute,
  # can_subset ordering, the sensor, freshness checks) with a synthetic
  # 2-package catalog and zero SQL Server connection.
  demo_mode: false

  workspace:
    # Option A — one SQLAlchemy URL held in an env var
    # connection_string_env_var: SSISDB_MSSQL_URL

    # Option B — flat fields. Values via {{ env.XXX }} Jinja templating.
    server:   "{{ env.SSIS_SERVER }}"         # sql-01.corp OR sql-01\INST1
    database: SSISDB
    user:     "{{ env.SSIS_USER }}"
    password: "{{ env.SSIS_PASSWORD }}"
    driver:   "ODBC Driver 18 for SQL Server"
    trust_server_certificate: true            # only for lab servers with self-signed TLS

  # Filter which SSISDB packages become Dagster assets.
  # Omit `package_selector:` to import every package.
  package_selector:
    by_folder: [Sales, Finance]
    include:   ["*sales*", "*revenue*"]
    exclude:   ["*_test*"]

  # Runtime parameters + environment references (only used when action=execute).
  # Applied at execute time via SSISDB.catalog.set_execution_parameter_value.
  # `{partition_key}` substitutes at run time from the run's partition.
  # package_overrides:
  #   - match: "Sales/*/LoadCustomers"
  #     parameters:
  #       Extract.TargetSchema: raw_sales
  #       Extract.BatchDate: "{partition_key}"
  #     environment_reference: "PROD"
  #   - match: "Sales/*/*"
  #     scope: project                          # object_type=20 (project param)
  #     parameters:
  #       CM.DEST_DB.ConnectionString: "Data Source=snowflake-01;..."

  # Per-package overrides, keyed by qualified name '<folder>/<project>/<package>'.
  # Mirrors dagster-databricks's assets_by_task_key shape. `deps:` is the only
  # way to declare a real run order between packages (SSISDB.catalog has no
  # native concept of inter-package dependency) -- with action=execute, a
  # selected dependency runs before the package that depends on it.
  # assets_by_package:
  #   Sales/SalesETL/LoadOrders:
  #     deps: [ssis/sql-01/Sales/SalesETL/ExtractCustomers]
  #     group_name: sales_nightly
  #     tags: {tier: critical}

  # What happens on materialize:
  #   noop     — external asset (declare-only, no execution triggered)
  #   execute  — EXEC SSISDB.catalog.create_execution + start_execution + poll
  #              (subsettable: selecting one package runs only that package)
  action: noop

  # Only used when action=execute
  wait_for_completion: true
  poll_interval_seconds: 30
  timeout_seconds: 3600

  # Opt-in polling sensor — emits AssetObservation per package based on
  # SSISDB.catalog.executions completions since the sensor's watermark.
  polling_sensor: true
  observation_interval_seconds: 300

  # Opt-in per-asset checks.
  # freshness_lag_threshold_seconds — fails when the last successful execution
  # is older than this many seconds (staleness).
  # max_execution_minutes — fails when the latest successful execution took
  # longer than this many minutes to run (runtime SLA, not staleness).
  freshness_lag_threshold_seconds: 3600
  max_execution_minutes: 30

  group_name: ssis_prod
  kinds: [ssis, mssql, etl]
  # asset_key_prefix: [ssis, sql-01]     # default: [ssis, <server-host>]
  # tags: {tier: production, domain: sales}
  # owners: [data-platform@acme.com]
