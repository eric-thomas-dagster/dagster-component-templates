type: dagster_community_components.TM1WorkspaceComponent
attributes:
  workspace:
    base_url:      "{{ env.TM1_URL }}"           # e.g. https://tm1.acme.com:5495
    username:      "{{ env.TM1_USER }}"
    password:      "{{ env.TM1_PASSWORD }}"
    # cam_namespace: "{{ env.TM1_CAM_NS }}"       # CAM SSO — omit for native auth
    # verify_ssl:   false                          # self-signed dev only

  # Filter — object-per-kind selectors. Each mirrors Fivetran's connector_selector.
  cube_selector:
    by_name: [Sales, Finance]
  process_selector:
    by_pattern: ["Load_*"]
  chore_selector:
    exclude_by_pattern: ["*_deprecated"]

  group_name: tm1_planning
  asset_key_prefix: [tm1]
  wait_for_completion: true
  timeout_seconds: 1800

  defs_state:
    management_type: LOCAL_FILESYSTEM
    refresh_if_dev: true
