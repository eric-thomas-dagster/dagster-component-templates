# yaml-language-server: $schema=https://raw.githubusercontent.com/eric-thomas-dagster/dagster-component-templates/main/jobs/datahub_export_job/schema.json
type: dagster_component_templates.DataHubExportJobComponent
attributes:
  job_name: sync_dagster_lineage_to_datahub
  schedule: "0 3 * * *"
  default_status: STOPPED
  catalog_url: https://datahub.acme.com/api/gms
