# yaml-language-server: $schema=https://raw.githubusercontent.com/eric-thomas-dagster/dagster-component-templates/main/jobs/purview_export_job/schema.json
type: dagster_component_templates.PurviewExportJobComponent
attributes:
  job_name: sync_dagster_lineage_to_purview
  schedule: "0 3 * * *"
