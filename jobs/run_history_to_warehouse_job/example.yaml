# yaml-language-server: $schema=https://raw.githubusercontent.com/eric-thomas-dagster/dagster-component-templates/main/jobs/run_history_to_warehouse_job/schema.json
type: dagster_component_templates.RunHistoryToWarehouseJobComponent
attributes:
  job_name: dagster_run_history_to_snowflake
  schedule: "*/15 * * * *"
  default_status: RUNNING
  warehouse: snowflake                  # snowflake | bigquery | postgres

  # Snowflake-specific
  snowflake_account: abc12345.us-east-1
  snowflake_user: DAGSTER_INGEST
  snowflake_password_env: SNOWFLAKE_PASSWORD
  snowflake_warehouse: LOAD_WH
  snowflake_database: ANALYTICS
  snowflake_schema: PLATFORM_OBSERVABILITY

  table: DAGSTER_RUN_HISTORY
  initial_lookback_hours: 48
  batch_limit: 1000
