[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prospect-recon-quickstart"
version = "0.1.0"
description = "Full-fidelity Dagster port of a real Prospect Recon routine: discovers a handed-off sales opportunity from Calendar/Drive signals, researches it (Drive/Notion/web via an agentic tool-use loop), builds a governed knowledge base (context_engineering_pipeline, with PII redaction and a context receipt store), synthesizes a structured brief, commits it to the dagster-demo-factory repo (the real downstream consumer), and notifies via Gmail draft + Slack."
requires-python = ">=3.10"
dependencies = [
    "dagster>=1.10.0",
    "dagster-community-components",
    "pandas>=1.5.0",
    "requests",
    "litellm",
    "chromadb",
    "google-auth",
    "google-api-python-client",
    "notion-client",
    "mcp",
    "pyyaml",
]

[dependency-groups]
dev = ["dagster-webserver", "dagster-dg-cli", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "prospect_recon"
registry_modules = ["dagster_community_components"]
