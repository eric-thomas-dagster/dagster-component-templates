# Step 6: same pipeline, but 50% of questions (seeded, so repeatable) are served from the candidate index. Each receipt keeps the
# code_version of the chunks it served; the `shadow_vs_live` asset check compares mean outcomes per recipe.
type: dagster_community_components.RAGPipelineComponent
attributes:
  asset_name: answers
  upstream_asset_key: questions
  retrievers:
    kb: {kind: chromadb, path: "${WORKDIR}/chroma_live", collection_name: support_kb}
    kb_candidate: {kind: chromadb, path: "${WORKDIR}/chroma_candidate", collection_name: support_kb_v2}
  steps:
    - {id: found, op: retrieve, retriever: kb, top_k: 3}
    - {id: ans, op: generate, source: found, model: gpt-4o-mini}
  receipts:
    resource_key: context_receipts
    context_name: support_kb
    rerank: {prior_weight: 0.3, explore_fraction: 0.0}
    shadow:
      retriever: kb_candidate
      fraction: 0.5
      seed: 42
      label: title-plus-body
      live_code_version: recipe-7
      candidate_code_version: recipe-8
      source_asset_key: support_kb
      min_outcomes: 5
      margin: 0.1
