version: 2

# `meta.dagster.asset_key` on each source maps the dbt source name to the
# SAME asset key as the real upstream Dagster asset that produces it
# (SyntheticDataGeneratorComponent, see defs/raw_customers/defs.yaml and
# defs/raw_orders/defs.yaml) -- without this, dagster-dbt's default key
# for a source is `<source_name>/<table_name>` (e.g. "raw/raw_customers"),
# which would show up as a SECOND, disconnected node in the asset graph
# instead of the real one. No translator subclass needed.

sources:
  - name: raw
    schema: raw
    tables:
      - name: raw_customers
        description: "Synthetic customer profiles, generated by SyntheticDataGeneratorComponent and written to DuckDB by DuckDBIOManagerComponent."
        meta:
          dagster:
            asset_key: ["raw_customers"]
        columns:
          - name: customer_id
            description: "Primary key, e.g. CUST000001."
      - name: raw_orders
        description: "Synthetic e-commerce orders, generated by SyntheticDataGeneratorComponent and written to DuckDB by DuckDBIOManagerComponent."
        meta:
          dagster:
            asset_key: ["raw_orders"]
        columns:
          - name: order_id
            description: "Primary key, e.g. ORD0000000001."
          - name: customer_id
            description: "Foreign key to raw_customers.customer_id."
