type: dagster_community_components.SyntheticDataGeneratorComponent
attributes:
  asset_name: raw_orders
  schema_type: orders
  row_count: 200
  random_state: 42
  description: "Synthetic e-commerce orders, one partition per day. customer_id always references raw_customers' CUST000001-CUST001000 range (orders don't need customers re-partitioned to stay consistent)."
  # Must match raw_customers.yaml's row_count -- this is the explicit,
  # visible link between the two assets' ID ranges. Previously hardcoded
  # to 1000 inside the generator itself with no config exposing it; a
  # customers resize with no matching change here would silently produce
  # orders referencing customers that don't exist, only caught (if at
  # all) by a downstream dbt relationships test failing after the fact.
  schema_options:
    customer_count: 1000
  group_name: synthetic_commerce
  include_preview_metadata: true
  partition_type: daily
  partition_start: "2026-09-01"
  # Declared Dagster dep (not just a dbt source FK) on the unpartitioned
  # raw_customers -- without this, nothing in Dagster's own asset graph
  # surfaces or enforces that raw_customers must exist first. A user who
  # materializes any raw_orders partition on a fresh load before ever
  # running raw_customers gets a dbt build that "succeeds" (dbt doesn't
  # know about this dependency either) but every row fails
  # relationships_stg_orders_customer_id, since raw.raw_customers is
  # empty. Confirmed directly: emptying raw_customers and re-checking a
  # materialized raw_orders partition reproduces 200/200 failures,
  # matching a real customer report exactly. This is a static
  # (non-partitioned) dep -- raw_customers won't re-run on every new
  # raw_orders partition, only when it hasn't been materialized yet.
  deps: ["raw_customers"]
  metadata:
    partition_expr: order_date
