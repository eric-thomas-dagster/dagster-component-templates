type: dagster_community_components.EnhancedDataQualityChecks
attributes:
  assets:
    raw_orders:
      # Explicit override rather than relying on auto-inheriting raw_orders'
      # partitions_def from sibling discovery -- must match raw_orders.yaml's
      # partition_type/partition_start exactly.
      partitions_def:
        type: daily
        start_date: "2026-09-01"
      null_check:
        - name: raw_orders_required_columns
          columns: [order_id, customer_id, order_date, category, num_items, subtotal, shipping, tax, total, status, region]
          blocking: false
      data_type_check:
        - name: raw_orders_dtypes
          columns:
            - column: total
              expected_type: float
            - column: num_items
              expected_type: int
          blocking: false
      # Daily revenue trend monitor -- emits a `max_delta` metadata value
      # (percent change vs. the trailing `history`-day average) on every
      # run, which Dagster's asset check history renders as a real numeric
      # trend chart. Requires raw_orders' per-partition random seed to
      # actually vary day to day (see synthetic_data_generator/component.py)
      # -- otherwise sum:total would be identical every day and this would
      # just be another flat line. Informational (blocking: false): a big
      # swing in a synthetic demo isn't a real incident, just something
      # worth a chart.
      percent_delta:
        - name: raw_orders_revenue_trend
          metric: "sum:total"
          max_delta: 50.0
          history: 7
          blocking: false
